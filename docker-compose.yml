version: '3.9'

services:
  backend:
    image: registry.digitalocean.com/praveshan/ammentor-backend-praveshan:latest
    container_name: praveshan-ammentor-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  depends_on:
      db:
        # This now waits for the db to be healthy, not just started
        condition: service_healthy

  db:
    image: postgres:14
    container_name: praveshan-ammentor-db
    restart: always
    environment:
      POSTGRES_DB: praveshan-ammentor
      POSTGRES_USER: ammentor_user
      POSTGRES_PASSWORD: strongpassword123
      
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ammentor_user -d praveshan-ammentor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
